# Словари сигналов (этап D) и красных флагов.
# Синтаксис фраз: "фраза" — фраза с начала слова, окончание может быть любым
# ("устал" найдёт «устала», «усталость»); "=фраза" — строго целое слово.
# Регистр и ё/е не важны.

signals:
  has_product:
    # Сильные: сами по себе означают, что человек продаёт.
    strong: [менторств, наставничеств, консультаци, разбор резюме, записаться,
             занимаюсь с, беру учеников, мой курс, набор открыт]
    # Слабые: «поток», «оплата», «стоимость» в IT-канале часто про данные,
    # Kafka и облака. Засчитываются, только если в том же посте есть сильная
    # фраза или цена (см. price_pattern).
    weak: [поток, оплата, стоимость]
  burned: [запускал курс, запускала курс, не набрался, вернул деньги, вернула деньги,
           больше не буду, забросил, лежит в столе, так и не дошли руки, не пошло,
           провалился, провалилась, закрыл набор, закрыла набор]
  pragmatic: [грейд, мидл, сеньор, оффер, вилк, собес, перформанс ревью,
              performance review, повышени, зарплат, карьер, найм]
  gold: [когда курс, где этому учиться, где этому научиться, будет обучение,
         возьмёшь в ученики, возьмешь в ученики, =продай, продай курс,
         продашь курс, сделай курс]
  burnout: [выгорел, устал, сокращени, уволился, уволилась, надоел найм, хочу уйти,
            работа высасывает]
  missionary: [помогаю новичкам, бесплатно разобрал, красота кода, делюсь,
               "хочу, чтобы", важно передать]
  limits: [не вывожу, нет сил, принял свои пределы, приняла свои пределы,
           перестал выжимать, перестала выжимать, много консультаций,
           не хватает времени, очередь на консультац, очередь на менторств,
           очередь из учеников, очередь учеников]
  # «очередь» само по себе ловит «в первую очередь», «за забором очередь
  # желающих» — заменено на конкретные фразы (2026-10-08).
  audience_care: [не хочу продавать, канал не для продаж, рекламу не беру,
                  боюсь, что отпишутся, не превращать в, уволили за пост]

# Цена в тексте: 5000 ₽, 15 000 руб, 30к рублей, $200
price_pattern: '(\d[\d\s]{1,7}\s?(₽|руб|р\.|тыс|к\s?руб|k\s?руб))|(\$\s?\d{2,})|(\d{2,}\s?\$)'

# Для блока «Свободный верх» (этап E): про кого продукт и контент.
audience:
  entry: [вкат, войти в it, войти в айти, с нуля, первая работа, стажировк,
          стажёр, стажер, джун, junior, перекат, смена профессии, новичк]
  pro: [мидл, middle, сеньор, senior, тимлид, лид, грейд, повышени, архитектор,
        перформанс ревью, performance review, рост в, staff, principal]

red_flags:
  infobiz: [успешный успех, легко и быстро, пассивный доход, выйди на новый уровень,
            выйти на новый уровень]
  infobiz_regex: ['осталось\s+\d+\s+мест']
  # Активная продажа СВОЕГО курса: пост последних 45 дней, где есть фраза
  # о своём курсе/потоке и слово продажи или цена. Просто «курс» не годится:
  # ловит «реклама айти-курсов», «сам проходил данный курс» (проверено 2026-10-08).
  course_word: [мой курс, моего курса, моем курсе, моему курсу, наш курс, нашего курса,
                нашем курсе, свой курс, своего курса, набор на курс, запись на курс,
                старт курса, старт потока, новый поток, следующий поток, набор открыт,
                предзапис, мою программу, моей программ]
  sale_words: [набор, старт, поток, оплат, стоимост, запис, предзапис, места, скидк]
  ads: ['#реклама', =реклама, erid, партнерский пост, партнёрский пост, на правах рекламы]
  we: [=мы, =нас, =нам, =наш, =наша, =наше, =наши, =нашей, =нашего, =нашим]
  i: [=я, =меня, =мне, =мой, =моя, =моё, =мое, =мои, =моей, =моего, =моим]

# Исключения: совпадение группы не засчитывается, если оно внутри такой фразы.
exclude:
  limits: [в первую очередь, в свою очередь, во вторую очередь, в очередь за,
           очередь задач, очередь сообщений, очереди сообщений, message queue]
  has_product: [поток данных, потоков данных, потоковая, потоковой]
  burnout: [не устал повторять]
