  title: Бэкенд-разработка
  min_post_share: 0.25
  terms: [=backend, бэкенд, бекенд, разработ, =java, =kotlin, =golang, =go, =python, =php, =c#, =.net, =rust, микросервис, =api, =rest, =grpc, =kafka, postgres, =redis, =docker, =kubernetes, =k8s, =highload, хайлоад, архитект, =system design, код, рефактор, =spring]
