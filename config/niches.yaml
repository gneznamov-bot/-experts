  terms: [дата-инженер, data engineer, =etl, =elt, =dwh, хранилищ, =data lake, =lakehouse, =spark, =airflow, =kafka, =hadoop, =dbt, =clickhouse, =greenplum, postgres, =sql, пайплайн, pipeline, витрин, =s3, =iceberg, =flink]
