# Ниши: термины для проверки «та ли ниша» (этап C) и запросы для поиска (этап A).
# habr_hubs — слаги хабов Хабра; взяты из реальных ссылок на страницах хабов
# (2026-10-08), не угаданы.
#
# Синтаксис терминов тот же, что в keywords.yaml:
#   "аналит"  — с начала слова, окончание любое: аналитик, аналитика, ...
#   "=sql"    — строго целое слово (нужно для коротких: =it, =go, =ии)
# Регистр и ё/е не важны.
#
# Отсечка «не та ниша» (этап C): канал проходит, если доля своих постов
# с терминами ниши ≥ min_post_share, либо термины есть в названии/описании
# и доля постов ≥ min_post_share / 2. Иначе — «не та ниша».
# Во фразе из нескольких слов окончание свободно только у последнего слова.

it:
  habr_hubs: [sql, data_engineering, analysis_design, productpm, career, python, java, go]
  title: IT в целом
  min_post_share: 0.25
  terms: [=айти, =it, =ит, разработ, программ, код, =backend, бэкенд, бекенд, =frontend, фронтенд, =fullstack, =devops, =sre, =qa, тестиров, тестировщ, автотест, =aqa, =sdet, =java, =kotlin, =python, =golang, =go, =rust, =c++, =js, =javascript, =typescript, =php, =sql, postgres, =clickhouse, =mysql, =kafka, =spark, =airflow, =hadoop, =dbt, =etl, =dwh, =data, =дата, датасаент, =ml, =llm, нейросет, =ии, =ai, =gpt, аналит, продакт, =a/b, ab-тест, метрик, дашборд, =bi, =tableau, =superset, архитект, микросервис, =api, =docker, =kubernetes, =k8s, =linux, =git, джун, =junior, мидл, =middle, сеньор, =senior, тимлид, =teamlead, собес, собеседован, грейд, стартап]
  roles: [системный аналитик, продуктовый аналитик, аналитик данных,
          дата-инженер, Java-разработчик, Go-разработчик, QA-инженер]
  tech: [SQL, Spark, Airflow, Kafka, Python, Go, Java]

analytics:
  habr_hubs: [sql, analysis_design, data_visualization, statistics, productpm]
  title: Аналитика (системная, продуктовая, данных)
  min_post_share: 0.25
  terms: [аналит, =sql, =python, =pandas, =a/b, ab-тест, метрик, дашборд, =bi, =tableau, =superset, =datalens, =clickhouse, когорт, ретеншн, =retention, воронк, гипотез, продакт, требован, =bpmn, =uml, =api, интеграц, постановк, бизнес-анализ, =data, =дата]
  roles: [системный аналитик, продуктовый аналитик, аналитик данных, бизнес-аналитик]
  tech: [SQL, Python, A/B тесты, BPMN, ClickHouse]

data_engineering:
