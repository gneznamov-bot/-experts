  title: Тестирование и автоматизация
  min_post_share: 0.25
  terms: [=qa, =aqa, =sdet, тестиров, тестировщ, автотест, автоматизация тестирован, автоматизацию тестирован, автоматизации тестирован, =selenium, =playwright, =appium, =junit, =testng, =pytest, =allure, баг, тест-кейс, регресс, нагрузочн]
